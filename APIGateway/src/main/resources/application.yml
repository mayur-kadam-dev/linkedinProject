server.port: 8080
eureka.client.service-url.defaultZone: http://localhost:8761/eureka
jwt.secretKey: asdfuasjf9a8s7fd89ihq34kljruyf98ayshcskdhfioafsuyfdcjha890sduf

spring:
  application.name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: connections-service
              uri: lb://CONNECTIONS-SERVICE
              predicates:
                - Path=/api/v1/connections/**
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter

            - id: users-service
              uri: lb://USERS-SERVICE
              predicates:
                - Path=/api/v1/users/**
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter

            - id: posts-service
              uri: lb://POSTS-SERVICE
              predicates:
                - Path=/api/v1/posts/**
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter